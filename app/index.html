mw.document.write(`<!doctype html><meta charset=utf-8><title>Wavy</title><style>body{margin:0;display:flex;align-items:center;gap:12px;padding:12px;height:100vh;box-sizing:border-box;background:var(--sc);color:var(--os);font:14px "Roboto Flex",Roboto,system-ui,sans-serif;-webkit-app-region:drag;overflow:hidden}button{-webkit-app-region:no-drag;font:inherit;color:inherit;border:0;background:none;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0}button:hover{background:var(--sch)}#a{width:84px;height:84px;flex:none;border-radius:24px}#i{flex:1;min-width:0}#t,#r{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#t{font-weight:500}#r{color:var(--osv);margin-bottom:6px}#b{display:flex;align-items:center}#p{background:var(--p);color:var(--op);border-radius:16px;width:52px}#x{position:absolute;right:4px;top:4px;width:28px;height:28px}</style><div id=a></div><div id=i><div id=t></div><div id=r></div><div id=b><button id=v>${I('pv')}</button><button id=p></button><button id=n>${I('nx')}</button></div></div><button id=x>${I('close',18)}</button>`);mw.document.close();
const g=i=>mw.document.getElementById(i);g('v').onclick=pv;g('p').onclick=tg;g('n').onclick=()=>nx();g('x').onclick=()=>mw.close();mn()}
function mn(){if(!mw||mw.closed)return;const d=mw.document,g=i=>d.getElementById(i),t=now();d.body.style.cssText=document.documentElement.style.cssText;if(!g('t'))return;
g('t').textContent=t?t.title:'Nothing playing';g('r').textContent=t?t.artist:'';g('a').style.background=t?bg(t.title,t.cov):'var(--pc)';g('p').innerHTML=I(paused()?'play':'pause',28)}
// ===== dialogs =====
function dlg(h){const d=$('#d');d.innerHTML=h;if(!d.open)d.showModal()}$('#d').addEventListener('click',e=>{if(e.target.id=='d')e.target.close()});
function newp(k=''){dlg(`<h2>New playlist</h2><input class="tf" id="pn" placeholder="Playlist name" autofocus><div class="ac"><button class="tb" data-a="cl">Cancel</button><button class="fb" data-a="mk" data-k="${E(k)}">Create</button></div>`)}
function more(k){const t=T.find(x=>x.key==k);dlg(`<h2>${E(t?.title||'Song')}</h2><button class="mi" data-a="pnext" data-k="${E(k)}">${I('queue')}Play next</button><button class="mi" data-a="addq" data-k="${E(k)}">${I('add')}Add to queue</button><p>Add to playlist</p>${Object.entries(pls).map(([id,p])=>`<button class="mi" data-a="addto" data-id="${id}" data-k="${E(k)}">${I('list')}${E(p.n)}</button>`).join('')}<button class="mi" data-a="newpk" data-k="${E(k)}">${I('add')}New playlist</button>${view.t=='pl'?`<button class="mi" data-a="rmpl" data-k="${E(k)}">${I('del')}Remove from this playlist</button>`:''}${t&&t.kind!='l'?`<button class="mi" data-a="rml" data-k="${E(k)}">${I('del')}Remove link</button>`:''}`)}
const sg=(l,n,o,d)=>`<p>${l}</p><div class="seg">${o.map(([v,t])=>`<button data-a="opt" data-n="${n}" data-v="${v}" class="${(st[n]??d)==v?'on':''}">${t}</button>`).join('')}</div>`;
function settings(){dlg(`<h2>Theme</h2>${sg('Mode','m',[['light','Light'],['dark','Dark'],['system','System']],'system')}${sg('AMOLED black','am',[[0,'Off'],[1,'On']],0)}${sg('Follow album art','fa',[[0,'Off'],[1,'On']],0)}<p>Accent color</p><div class="sws">${[265,210,165,95,30,345].map(h=>`<button class="sw${st.h==h?' on':''}" data-a="hue" data-v="${h}" style="background:hsl(${h} 60% 50%)" aria-label="Color ${h}"></button>`).join('')}</div><input type="range" id="hue" min="0" max="360" value="${st.h}" aria-label="Custom hue">${sg('Corners','sa',[[0,'Sharp'],[1,'Soft'],[2,'Round']],1)}${sg('Animation','sp',[['calm','Calm'],['normal','Normal'],['lively','Lively']],'normal')}${NAT?`<p>Library</p><button class="mi" data-a="folders">${I('folder')}Manage library folders</button><button class="mi" data-a="opendl">${I('dl')}Open Downloaded Songs folder</button>`:''}<div class="ac"><button class="fb" data-a="cl">Done</button></div>`)}
function sleepD(){dlg(`<h2>Sleep timer</h2><p>${slt?`Music stops in about ${Math.ceil((slt-Date.now())/6e4)} min.`:'Stop the music after:'}</p>${[15,30,60].map(m=>`<button class="mi" data-a="slpset" data-v="${m}">${I('timer')}${m} minutes</button>`).join('')}${slt?`<button class="mi" data-a="slpset" data-v="0">${I('close')}Turn off</button>`:''}`)}
function linkD(u=''){dlg(`<h2>Play from a link</h2><p>YouTube, YouTube Music, Spotify or a direct audio link.</p><input class="tf" id="lu" placeholder="https://" value="${E(u)}" autofocus>${NAT?`<p>MP3 quality for downloads</p><div class="seg">${[[5,'Small'],[2,'Balanced'],[0,'High']].map(([v,t])=>`<button data-a="dq" data-v="${v}" class="${(st.dq??2)==v?'on':''}">${t}</button>`).join('')}</div><p style="font-size:12px">Saved to Music/Downloaded Songs. Only download music you have the right to keep. Spotify links can be played but not downloaded.</p>`:''}<div class="ac"><button class="tb" data-a="cl">Cancel</button>${NAT?`<button class="tb" data-a="dlmp3">${I('dl')}Download MP3</button>`:''}<button class="fb" data-a="golink">Play</button></div>`)}
function dpShow(t,p){$('#dp').classList.toggle('on',!!t);if(t){$('#dt').textContent=t;$('#db i').style.width=Math.round((p||0)*100)+'%'}}
async function download(u){const p=parseU(u);if(!p){toast('Paste a valid link first');return}if(p.kind=='s'){toast('Spotify tracks cannot be downloaded');return}
dpShow('Starting…',0);const r=await api.dl(p.kind=='y'?'https://www.youtube.com/watch?v='+p.id:u,st.dq??2);dpShow(null);
if(r.ok){toast('Downloaded: '+r.name);await loadLib()}else toast('Download failed: '+r.err.slice(0,140))}
function foldersD(){dlg(`<h2>Library folders</h2>${libF.map((f,i)=>`<div class="mi">${I('folder')}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${E(f)}">${E(f)}</span><button class="ib" data-a="rmf" data-i="${i}" aria-label="Remove">${I('close')}</button></div>`).join('')}<div class="ac"><button class="tb" data-a="addf">${I('add')}Add folder</button><button class="fb" data-a="cl">Done</button></div>`)}
function optsD(){dlg(`<h2>Playback</h2>${sg('Speed','spd',[[0.5,'0.5×'],[0.75,'0.75×'],[1,'1×'],[1.25,'1.25×'],[1.5,'1.5×'],[2,'2×']],1)}<p>Equalizer (your own files only)</p>${['Bass','Mid','Treble'].map((n,j)=>`<label class="eq">${n}<input type="range" id="eq${j}" min="-12" max="12" step="1" value="${(st.eq||[0,0,0])[j]}"></label>`).join('')}<p>A–B loop</p><div class="seg"><button data-a="abA">Set A${ab[0]!=null?' · '+fmt(ab[0]):''}</button><button data-a="abB">Set B${ab[1]!=null?' · '+fmt(ab[1]):''}</button><button data-a="abX">Clear</button></div><div class="ac"><button class="fb" data-a="cl">Done</button></div>`)}
const applyO=()=>{au.playbackRate=ra.playbackRate=+(st.spd||1)};
function eqApply(){eq.forEach((f,j)=>f.gain.value=(st.eq||[0,0,0])[j])}
const op=tr=>{if(!tr?.length)return;const a=tr.map(x=>{const t=mk(x),e=T.find(y=>y.key==t.key);if(e)return e;T.push(t);return t});T.sort(cmp.title);render();scan();play(a,0)};
const save=()=>S('pls',pls),sv=()=>S('st',st);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset,cl=()=>$('#d').close(),tk=()=>T.find(x=>x.key==D.k);
if(a=='nav'){view={t:D.v};q='';$('#q').value='';render()}
else if(a=='open'){view={t:D.t,id:D.v};render()}
else if(a=='chip'){view={t:'songs',f:D.v};render()}
else if(a=='play'){play(list(),+D.i)}
else if(a=='all'){sh=0;tgl();play(list(),0)}
else if(a=='shuf'){sh=1;tgl();const l=list();play(l,Math.random()*l.length|0)}
else if(a=='more'){more(D.k)}
else if(a=='fav'){M(D.k).f^=1;sM();render()}
else if(a=='pnext'){const t=tk();if(t){qu.splice(qi+1,0,t);toast('Playing next')}cl()}
else if(a=='addq'){const t=tk();if(t){qu.push(t);toast('Added to queue')}cl()}
else if(a=='rmq'){const i=+D.i;qu.splice(i,1);if(i<qi)qi--;else if(i==qi){if(qu.length){qi=Math.min(qi,qu.length-1);load()}else{pauseAll();qi=-1}}render()}
else if(a=='clrq'){qu=qu.filter((_,i)=>i==qi);qi=qu.length?0:-1;render()}
else if(a=='addf'){NAT?api.lib.add().then(r=>{if(r){setLib(r);if($('#d').open)foldersD()}}):$('#fd').click()}else if(a=='addx'){$('#ff').click()}
else if(a=='link'){linkD()}
else if(a=='golink'){const u=$('#lu').value;cl();addLink(u)}
else if(a=='rml'){T=T.filter(x=>x.key!=D.k);links=links.filter(l=>l.key!=D.k);S('links',links);cl();render()}
else if(a=='ecl'){pauseE();showE(0)}
else if(a=='newp'){newp()}else if(a=='newpk'){newp(D.k)}
else if(a=='mk'){const id='p'+Date.now();pls[id]={n:$('#pn').value.trim()||'My playlist',k:D.k?[D.k]:[]};save();cl();render()}
else if(a=='addto'){const p=pls[D.id];if(!p.k.includes(D.k))p.k.push(D.k);save();cl();render()}
else if(a=='rmpl'){const p=pls[view.id];p.k=p.k.filter(k=>k!=D.k);save();cl();render()}
else if(a=='delp'){delete pls[view.id];save();view={t:'playlists'};render()}
else if(a=='cl'){cl()}else if(a=='set'){settings()}
else if(a=='opt'){st[D.n]=/^\d+$/.test(D.v)?+D.v:D.v;sv();theme();applyO();D.n=='spd'?optsD():settings()}
else if(a=='hue'){st.h=+D.v;sv();theme();settings()}
else if(a=='slp'){sleepD()}else if(a=='slpset'){slp(+D.v);cl()}else if(a=='mini'){mini()}
else if(a=='dq'){st.dq=+D.v;sv();linkD($('#lu').value)}
else if(a=='dlmp3'){const u=$('#lu').value;cl();download(u)}
else if(a=='folders'){foldersD()}
else if(a=='rmf'){api.lib.remove(libF[+D.i]).then(r=>{setLib(r);foldersD()})}
else if(a=='opendl'){api.lib.openDl()}
else if(a=='opts'){optsD()}
else if(a=='abA'){ab[0]=ct();if(ab[1]!=null&&ab[1]<=ab[0])ab[1]=null;optsD()}
else if(a=='abB'){if(ab[0]==null)ab[0]=0;ab[1]=ct()>ab[0]?ct():null;optsD()}
else if(a=='abX'){ab=[null,null];optsD()}
else if(a=='mute'){au.muted=ra.muted=!au.muted;try{au.muted?YP?.mute():YP?.unMute()}catch{}$('#vi').classList.toggle('on',au.muted)}
else if(a=='fs'){if(qi>=0)$('#pl').classList.add('full');document.fullscreenElement?document.exitFullscreen():$('#pl').requestFullscreen?.()}
else if(a=='tg'){tg()}else if(a=='nx'){nx()}else if(a=='pv'){pv()}
else if(a=='sh'){sh=sh?0:1;tgl()}else if(a=='rp'){rp=(rp+1)%3;tgl()}
else if(a=='max'){if(qi>=0)$('#pl').classList.add('full')}else if(a=='min'){e.stopPropagation();$('#pl').classList.remove('full')}});
document.addEventListener('input',e=>{const i=e.target.id;if(i=='q'){q=e.target.value;render()}else if(i=='so'){so=e.target.value;st.so=so;sv();render()}
else if(i=='vo'){const v=+e.target.value;au.volume=ra.volume=v;try{YP?.setVolume(v*100)}catch{}}else if(/^eq\d$/.test(i)){st.eq=st.eq||[0,0,0];st.eq[+i[2]]=+e.target.value;sv();eqApply()}else if(i=='hue'){st.h=+e.target.value;sv();theme()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){if(e.target.id=='pn')$('[data-a=mk]').click();if(e.target.id=='lu')$('[data-a=golink]').click()}
if(/INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName)||$('#d').open)return;
if(e.code=='Space'){e.preventDefault();tg()}else if(e.key=='ArrowRight')seekT(ct()+5);else if(e.key=='ArrowLeft')seekT(ct()-5);else if(e.key=='Escape')$('#pl').classList.remove('full');else if(e.key=='n')nx();else if(e.key=='p')pv();else if(e.key=='m')$('[data-a=mute]').click();else if(e.key=='f')$('[data-a=fs]').click();else if(e.key=='l'){rp=(rp+1)%3;tgl()}});
['fd','ff'].forEach(id=>$('#'+id).addEventListener('change',e=>{add(e.target.files);e.target.value=''}));
// queue drag-and-drop reordering, and dropping files to add them
let dgi=-1;const rr=e=>e.target.closest?.('.r[draggable]');
document.addEventListener('dragstart',e=>{const r=rr(e);if(r){dgi=+r.dataset.i;r.classList.add('dg');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','q')}});
document.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.ov').forEach(x=>x.classList.remove('ov'));if(dgi>=0)rr(e)?.classList.add('ov')});
document.addEventListener('drop',e=>{e.preventDefault();const r=rr(e);if(dgi>=0){if(r){const to=+r.dataset.i,cur=now(),[m]=qu.splice(dgi,1);qu.splice(to,0,m);qi=qu.indexOf(cur);render()}}else add(e.dataTransfer.files);dgi=-1});
document.addEventListener('dragend',()=>{dgi=-1;render()});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(st.m=='system')theme()});
// ===== init =====
let slt=0,sto;
document.querySelectorAll('.ri').forEach((b,i)=>b.querySelector('i').innerHTML=I(['music','folder','list','queue','theme'][i]));
$('#si').innerHTML=I('search');$('#b1').innerHTML=I('folder')+'Add folder';$('#b2').innerHTML=I('add')+'Add files';$('#b3').innerHTML=I('link')+'Play link';
$('#bs').innerHTML=I('sh');$('#bp').innerHTML=I('pv');$('#bn').innerHTML=I('nx');$('#min').innerHTML=I('down',32);$('#vi').innerHTML=I('vol');
$('#bz').innerHTML=I('timer');$('#bz').title='Sleep timer';$('#bm').innerHTML=I('pip');$('#bm').title='Mini player';$('#bz').setAttribute('aria-label','Sleep timer');$('#bm').setAttribute('aria-label','Mini player');
links.forEach(l=>{T.push({...l,url:l.kind=='r'?l.id:'',folder:'Links'});M(l.key)});
$('#bo').innerHTML=I('tune');$('#bo').title='Playback options';$('#bf').innerHTML=I('fs');$('#bf').title='Fullscreen (F)';applyO();
$('#pa').innerHTML=art('Wavy','var(--as)');ui();tgl();theme();render();
if(NAT){loadLib();api.onDl(d=>dpShow(d.stage,d.p));api.opened().then(op);api.onOpen(op)}
</script></body></html>
